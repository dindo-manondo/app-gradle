plugins {
    id 'application'
}

group = 'com.dindo'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.dindo.appgradle.App'
}

test {
    useJUnit()
}

jar {
    archiveBaseName = 'app-gradle'
    manifest {
        attributes 'Main-Class': 'com.dindo.appgradle.App'
    }
}
